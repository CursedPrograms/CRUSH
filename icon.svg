<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="CRUSH logo">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CE3AD"/>
      <stop offset="1" stop-color="#3BA876"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#153226"/>
      <stop offset="1" stop-color="#0A0E0C"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)" stroke="#243029" stroke-width="2"/>

  <!-- top plate pressing down -->
  <polyline points="92,78 128,106 164,78" fill="none" stroke="#7CE3AD" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the data, squeezed into shorter and shorter bars -->
  <rect x="71"  y="116" width="114" height="13" rx="6.5" fill="url(#bar)"/>
  <rect x="86"  y="135" width="84"  height="13" rx="6.5" fill="url(#bar)" opacity="0.92"/>
  <rect x="101" y="154" width="54"  height="13" rx="6.5" fill="url(#bar)" opacity="0.84"/>

  <!-- bottom plate pressing up -->
  <polyline points="92,189 128,161 164,189" fill="none" stroke="#7CE3AD" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
